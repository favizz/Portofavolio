# A small IoT telemetry platform: ingest API, an anomaly-detection worker,
# an MQTT broker, Postgres, Redis, and an nginx reverse proxy in front of
# the API. Same shape as the Netflow project's own deployment (MQTT +
# Redis-backed job queue + nginx in front of a Node API), reimplemented
# here as an original, self-contained example for this showcase.
#
# Validated with `docker compose config` (see the showcase page /
# README for the exact command and the resolved-config output).

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: postgres://telemetry:telemetry@postgres:5432/telemetry
      REDIS_URL: redis://redis:6379
      MQTT_URL: mqtt://mosquitto:1883
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mosquitto:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: ./worker
    environment:
      DATABASE_URL: postgres://telemetry:telemetry@postgres:5432/telemetry
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    # Anomaly-detection workers scale horizontally behind the same Redis
    # queue; the API only ever enqueues, it never runs detection inline.
    deploy:
      replicas: 2

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry
      POSTGRES_DB: telemetry
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
