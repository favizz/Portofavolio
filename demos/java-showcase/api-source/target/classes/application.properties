spring.application.name=asset-service

# Production: SQL Server (see the internship report - MS SQL Server 2022,
# TDS/1433, split operational + logging databases). This showcase build
# uses H2 in-memory so `mvn spring-boot:run` works with zero external
# dependencies.
spring.datasource.url=jdbc:h2:mem:assetdb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update

app.jwt.secret=${JWT_SECRET:showcase-only-secret-change-me-in-real-deployment}
