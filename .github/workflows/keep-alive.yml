name: Keep TransJakarta services warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health
        run: curl -sS -o /dev/null -w "api: %{http_code}\n" --max-time 90 https://transjakarta-api.onrender.com/health
      - name: Ping web root
        run: curl -sS -o /dev/null -w "web: %{http_code}\n" --max-time 90 https://transjakarta-web.onrender.com/
